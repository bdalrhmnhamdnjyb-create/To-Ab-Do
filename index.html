<head>

<style>
:root{--bg:#fff7ed;--card:#ffffff;--text:#2b1d3a;--muted:#8a7a99;--p:#7c3aed;--p2:#ec4899;--p3:#f59e0b;--line:#eadfff;--ok:#10b981;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--card:#211736;--text:#f5eeff;--muted:#a597bd;--line:#3a2b59}}
:root[data-theme="dark"]{--bg:#150f24;--card:#211736;--text:#f5eeff;--muted:#a597bd;--line:#3a2b59}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;
background-image:radial-gradient(circle at 15% 10%,#ec489933,transparent 40%),radial-gradient(circle at 85% 90%,#7c3aed33,transparent 45%)}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.logo{direction:ltr;text-align:center;font-size:clamp(2.6rem,12vw,4.2rem);font-weight:900;margin:0;letter-spacing:-1px;line-height:1.1}
.logo .to,.logo .do{background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .ab{display:inline-block;background:linear-gradient(135deg,var(--p3),var(--p2));color:#fff;padding:0 .18em;border-radius:.3em;transform:rotate(-4deg);margin:0 .06em;box-shadow:0 6px 0 #c2410c55;animation:wob 3s ease-in-out infinite}
.logo .dash{color:var(--muted)}
@keyframes wob{50%{transform:rotate(3deg) scale(1.06)}}
.tag{text-align:center;color:var(--muted);margin:8px 0 22px;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 30px #7c3aed1f}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
.add input:focus{border-color:var(--p)}
.btn{font:inherit;font-weight:900;border:0;border-radius:14px;padding:0 18px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 5px 0 #5b21b6;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5b21b6}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p3),var(--p2),var(--p));transition:width .5s}
.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-weight:700}
ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg);border:2px solid var(--line);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
li.done{opacity:.6}
li.done .t{text-decoration:line-through;color:var(--muted)}
.ck{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--p);background:transparent;cursor:pointer;color:#fff;font-size:1.1rem;display:grid;place-items:center;transition:.2s}
li.done .ck{background:var(--ok);border-color:var(--ok);transform:scale(1.1)}
.t{flex:1;font-weight:700;word-break:break-word}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer}
.x:hover{color:#ef4444}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-weight:700}
.tools{display:flex;justify-content:center;gap:10px;margin-top:18px}
.tools button{font:inherit;font-weight:700;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:99px;padding:6px 16px;cursor:pointer}
.hide{display:none!important}
.hi{text-align:center;font-weight:900;color:var(--p);margin:-10px 0 16px}
.auth{margin-top:6px}
.auth input{display:block;width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
.auth input:focus{border-color:var(--p)}
.auth .btn{width:100%;padding:13px;font-size:1.05rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:900;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}
#err{color:#ef4444;font-weight:700;min-height:1.4em;margin:2px 0 10px;text-align:center}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin:12px 0 0}
.in{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
.in:focus{border-color:var(--p)}
.ah{margin:0 0 12px;font-weight:900;font-size:1.3rem}
.arow{display:flex;gap:10px}.arow .btn{flex:1;padding:12px 0}
.btn.alt{background:linear-gradient(135deg,var(--p3),var(--p2));box-shadow:0 5px 0 #c2410c}
.amsg{min-height:1.4em;margin-top:10px;font-weight:700;color:#ef4444;text-align:center}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin:8px 0 0}
.ubar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:900}
.ubar button{font:inherit;font-weight:700;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.dt{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#ov{position:fixed;inset:0;z-index:40;display:none;place-items:center;text-align:center;background:#150f24b3;cursor:pointer;padding:20px}
#ov.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
#ov .big{font-size:clamp(5rem,28vw,10rem);animation:pop .7s cubic-bezier(.2,1.8,.4,1) both;filter:drop-shadow(0 10px 30px #f59e0b)}
#ov h2{margin:0;font-size:clamp(2rem,9vw,3.4rem);font-weight:900;color:#fff;text-shadow:0 4px 0 #7c3aed,0 0 30px #ec4899;animation:pop .7s .1s cubic-bezier(.2,1.8,.4,1) both}
#ov p{color:#ffe;font-weight:700;font-size:1.2rem;margin:8px 0 0;animation:pop .7s .2s both}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}}
</style>

<div id="ov"><div><div class="big" id="ovE">🎉</div><h2 id="ovT"></h2><p id="ovP"></p></div></div>
<div class="wrap hide" id="auth-wrap" style="padding-bottom:0">
  <h1 class="logo"><span class="to">To</span><span class="ab">(AB)</span><span class="dash">-</span><span class="do">Do</span></h1>
  <div class="tag">سجّل دخولك عشان مهامك تفضل ليك</div>

<div class="wrap hide" id="wrap">
  <h1 class="logo"><span class="to">To</span><span class="ab">(AB)</span><span class="dash">-</span><span class="do">Do</span></h1>

<script>
(function(){
var $=function(i){return document.getElementById(i)},UK='toabdo_users',SK='toabdo_session',mode='L';
function users(){try{return JSON.parse(localStorage.getItem(UK)||'{}')||{}}catch(e){return {}}}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function hash(p,salt){var en=new TextEncoder();return crypto.subtle.importKey('raw',en.encode(p),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:en.encode(salt),iterations:100000,hash:'SHA-256'},k,256)}).then(hex)}
var us=users(),s=null;try{s=localStorage.getItem(SK)}catch(e){}
if(s&&us[s]){
  window.TOABDO_USER=s;$('wrap').classList.remove('hide');$('hi').textContent='أهلاً يا '+us[s].name+' 👋';
  $('out').onclick=function(){try{localStorage.removeItem(SK)}catch(e){}location.reload()};
}else{
  $('auth-wrap').classList.remove('hide');
  function setMode(m){mode=m;$('tL').className=m==='L'?'on':'';$('tR').className=m==='R'?'on':'';$('ap2').classList.toggle('hide',m==='L');$('go').textContent=m==='L'?'ادخل':'اعمل الحساب';$('ap').autocomplete=m==='L'?'current-password':'new-password';$('err').textContent=''}
  $('tL').onclick=function(){setMode('L')};$('tR').onclick=function(){setMode('R')};
  function fail(m){$('err').textContent=m}
  function enter(key){try{localStorage.setItem(SK,key)}catch(e){}location.reload()}
  function go(){
    var name=$('au').value.trim(),key=name.toLowerCase(),pw=$('ap').value,u=users();
    if(!name||!pw)return fail('اكتب اسم المستخدم وكلمة السر');
    if(!window.crypto||!crypto.subtle)return fail('المتصفح ده مش بيدعم التشفير، افتح الموقع من رابط https');
    if(mode==='L'){
      if(!u[key])return fail('الحساب ده مش موجود');
      hash(pw,u[key].salt).then(function(h){h===u[key].hash?enter(key):fail('كلمة السر غلط')});
    }else{
      if(u[key])return fail('الاسم ده مستخدم قبل كده');
      if(pw.length<4)return fail('كلمة السر لازم 4 حروف على الأقل');
      if(pw!==$('ap2').value)return fail('كلمتين السر مش متطابقين');
      var a=new Uint8Array(16);crypto.getRandomValues(a);var salt=hex(a);
      hash(pw,salt).then(function(h){
        u[key]={name:name,salt:salt,hash:h};
        try{
          localStorage.setItem(UK,JSON.stringify(u));
          if(Object.keys(u).length===1){var old=localStorage.getItem('toabdo');if(old){localStorage.setItem('toabdo:'+key,old);localStorage.setItem('toabdo_total:'+key,localStorage.getItem('toabdo_total')||'0');localStorage.removeItem('toabdo');localStorage.removeItem('toabdo_total')}}
        }catch(e){return fail('مش قادر أحفظ الحساب، المتصفح مانع التخزين')}
        enter(key);
      });
    }
  }
  $('go').onclick=go;
  ['au','ap','ap2'].forEach(function(i){$(i).onkeydown=function(e){if(e.key==='Enter')go()}});
}
})();
</script>

<script>
(function(){
var U=window.TOABDO_USER;if(!U)return;
var K="toabdo:"+U,KT="toabdo_total:"+U;
var tasks=[],muted=false,total=0;
try{tasks=JSON.parse(localStorage.getItem(K)||'[]');total=+localStorage.getItem(KT)||0;muted=localStorage.getItem('toabdo_mute')==='1'}catch(e){}
if(!Array.isArray(tasks))tasks=[];
function save(){try{localStorage.setItem(K,JSON.stringify(tasks));localStorage.setItem(KT,total);localStorage.setItem('toabdo_mute',muted?'1':'0')}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  var l=$('list');
  l.innerHTML=tasks.length?'':'<div class="empty">مفيش مهام لسه… ضيف أول واحدة ✨</div>';
  tasks.forEach(function(t){
    var li=document.createElement('li');li.className=t.d?'done':'';
    li.innerHTML='<button class="ck" aria-label="إنجاز">'+(t.d?'✓':'')+'</button><span class="t">'+esc(t.t)+(t.d&&t.at?'<small class="dt">اتنجزت '+new Date(t.at).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+'</small>':'')+'</span><button class="x" aria-label="حذف">✕</button>';
    li.children[0].onclick=function(e){toggle(t.id,e)};
    li.children[2].onclick=function(){tasks=tasks.filter(function(x){return x.id!==t.id});save();render()};
    l.appendChild(li);
  });
  var d=tasks.filter(function(t){return t.d}).length;
  $('pb').style.width=(tasks.length?d/tasks.length*100:0)+'%';
  $('s1').textContent=d+' من '+tasks.length;
  $('s2').textContent='🏆 اتنجز: '+total;
  $('mute').textContent=muted?'🔇 الموسيقى: مقفولة':'🔊 الموسيقى: شغّالة';
}
function add(){var v=$('inp').value.trim();if(!v)return;tasks.unshift({id:Date.now()+Math.random(),t:v,d:false});$('inp').value='';save();render();blip()}
$('addB').onclick=add;$('inp').onkeydown=function(e){if(e.key==='Enter')add()};
$('mute').onclick=function(){muted=!muted;save();render();if(!muted)blip()};
$('clr').onclick=function(){tasks=tasks.filter(function(t){return !t.d});save();render()};
function toggle(id,e){
  var t=tasks.filter(function(x){return x.id===id})[0];if(!t)return;
  t.d=!t.d;t.at=t.d?Date.now():0;
  if(t.d){total++;save();render();celebrate(t.t,e)}else{total=Math.max(0,total-1);save();render()}
}
/* ---------- Audio ---------- */
var ac=null;
function ctx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,dur,type,vol){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.15,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.05);
}
function drum(t0){
  var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.15);
  g.gain.setValueAtTime(.4,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.2);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.25);
}
function blip(){if(muted)return;var c=ctx();if(!c)return;var n=c.currentTime;tone(660,n,.1,'sine',.1);tone(880,n+.08,.12,'sine',.1)}
var N={C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5,E6:1318.5,G6:1567.98,C4:261.63,G4:392};
var songs=[
 [['C5',0,.14],['E5',.14,.14],['G5',.28,.14],['C6',.42,.14],['G5',.56,.14],['C6',.7,.14],['E6',.84,.5],['C6',.84,.5],['G5',.84,.5]],
 [['G4',0,.12],['G4',.12,.12],['G4',.24,.12],['C5',.4,.4],['E5',.8,.12],['E5',.92,.12],['E5',1.04,.12],['G5',1.2,.6],['C6',1.2,.6],['E6',1.2,.6]],
 [['C5',0,.1],['D5',.1,.1],['E5',.2,.1],['G5',.3,.1],['A5',.4,.1],['C6',.5,.15],['B5',.68,.1],['C6',.8,.15],['E6',.98,.15],['G6',1.15,.7],['C6',1.15,.7],['E6',1.15,.7]]
];
function music(){
  if(muted)return;var c=ctx();if(!c)return;var n=c.currentTime+.02;
  var s=songs[Math.floor(Math.random()*songs.length)];
  s.forEach(function(x){tone(N[x[0]],n+x[1],x[2]+.15,'triangle',.14);tone(N[x[0]]/2,n+x[1],x[2]+.1,'sine',.08)});
  [0,.28,.56,.84].forEach(function(d){drum(n+d)});
  for(var i=0;i<8;i++)tone(2000+Math.random()*2500,n+.9+i*.07,.2,'sine',.04);
}
/* ---------- Confetti ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),P=[],run=false,W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
var COL=['#f59e0b','#ec4899','#7c3aed','#10b981','#38bdf8','#fde047','#fb7185'];
function burst(x,y,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*10;
    P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:5+Math.random()*8,c:COL[Math.floor(Math.random()*COL.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:100+Math.random()*60,sh:Math.random()<.3})}
  if(!run){run=true;requestAnimationFrame(tick)}
}
function rain(n){for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,s:6+Math.random()*7,c:COL[Math.floor(Math.random()*COL.length)],r:0,vr:(Math.random()-.5)*.3,l:200,sh:false});if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){
  cx.clearRect(0,0,W,H);
  P=P.filter(function(p){return p.l>0&&p.y<H+30});
  P.forEach(function(p){
    p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);
    if(p.sh){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore();
  });
  if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,W,H)}
}
/* ---------- Celebration ---------- */
var MSG=['عاش يا بطل! 🔥','أسطورة! 👑','مهمة وانتهت! 💪','إنت جامد جدًا! 😎','يا سلام يا سلام! 🤩','نجم النجوم! ⭐','كمّل يا وحش! 🚀','تحفة! 🎯'];
var EM=['🎉','🏆','🥳','🚀','⭐','👑','🔥','🎊'];
var hideT;
function celebrate(name,e){
  var i=Math.floor(Math.random()*MSG.length);
  $('ovE').textContent=EM[i];$('ovT').textContent=MSG[i];$('ovP').textContent='خلّصت: '+name;
  var o=$('ov');o.classList.remove('on');void o.offsetWidth;o.classList.add('on');
  music();
  burst(W/2,H/2,160);rain(90);
  [250,500,750,1000,1300].forEach(function(d){setTimeout(function(){burst(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4),70)},d)});
  clearTimeout(hideT);hideT=setTimeout(function(){o.classList.remove('on')},2800);
  if(navigator.vibrate)try{navigator.vibrate([60,40,60,40,120])}catch(x){}
}
$('ov').onclick=function(){this.classList.remove('on')};
/* ---------- Auth ---------- */
function users(){try{return JSON.parse(localStorage.getItem('toabdo_users')||'{}')}catch(e){return {}}}
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function hashPw(pw,salt){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},k,256));
}
function show(id,v,d){$(id).style.display=v?(d||'block'):'none'}
function msg(t,ok){var m=$('amsg');m.textContent=t||'';m.style.color=ok?'#10b981':'#ef4444'}
function enter(key){
  var u=users()[key];if(!u)return false;
  user={key:key,name:u.name};
  try{localStorage.setItem('toabdo_session',key)}catch(e){}
  var d={};try{d=JSON.parse(localStorage.getItem('toabdo_d_'+key)||'{}')}catch(e){}
  tasks=Array.isArray(d.tasks)?d.tasks:[];total=+d.total||0;
  $('hi').textContent='أهلًا يا '+u.name+' 👋';
  show('auth',0);show('appCard',1);show('tools',1,'flex');show('ubar',1,'flex');render();return true;
}
function leave(){
  user=null;tasks=[];total=0;try{localStorage.removeItem('toabdo_session')}catch(e){}
  $('un').value='';$('pw').value='';msg('');
  show('appCard',0);show('tools',0);show('ubar',0);show('auth',1);
}
function creds(){
  var n=$('un').value.trim(),p=$('pw').value;
  if(n.length<2){msg('اسم المستخدم لازم حرفين على الأقل');return null}
  if(p.length<4){msg('كلمة السر لازم ٤ حروف على الأقل');return null}
  if(!window.crypto||!crypto.subtle){msg('المتصفح ده مش بيدعم التشفير، افتح الموقع من رابط https');return null}
  return {n:n,k:n.toLowerCase(),p:p};
}
$('signB').onclick=async function(){
  var c=creds();if(!c)return;
  var all=users();
  if(all[c.k]){msg('الاسم ده موجود قبل كده، جرّب اسم تاني أو سجّل دخول');return}
  var salt=crypto.getRandomValues(new Uint8Array(16));
  all[c.k]={name:c.n,salt:b64(salt),hash:await hashPw(c.p,salt)};
  try{
    localStorage.setItem('toabdo_users',JSON.stringify(all));
    var old=localStorage.getItem('toabdo');
    if(old&&Object.keys(all).length===1){localStorage.setItem('toabdo_d_'+c.k,JSON.stringify({tasks:JSON.parse(old),total:+localStorage.getItem('toabdo_total')||0}));localStorage.removeItem('toabdo');localStorage.removeItem('toabdo_total')}
  }catch(e){msg('مقدرتش أحفظ الحساب، اتأكد إن المتصفح مش في وضع التصفح الخفي');return}
  enter(c.k);blip();
};
$('loginB').onclick=async function(){
  var c=creds();if(!c)return;
  var u=users()[c.k];
  if(!u){msg('مفيش حساب بالاسم ده، اضغط "حساب جديد"');return}
  if(await hashPw(c.p,unb64(u.salt))!==u.hash){msg('كلمة السر غلط');return}
  enter(c.k);blip();
};
$('pw').onkeydown=function(e){if(e.key==='Enter')$('loginB').click()};
$('out').onclick=leave;
var ses=null;try{ses=localStorage.getItem('toabdo_session')}catch(e){}
if(!(ses&&enter(ses)))leave();
})();
</script>
